plugins {
    id 'com.android.application'
}

/* Credenciales de firma: viven en android/keystore.properties (NO va a git) */
def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) {
    keystoreProps.load(new FileInputStream(keystoreFile))
}

/* UN SOLO lugar donde vive la version del cascaron nativo: de aqui salen
   versionCode/versionName Y los parametros que la app se pasa a si misma al
   abrir el sitio (ver DEFAULT_URL en AndroidManifest.xml). Sin eso la web no
   tendria forma de saber que version de APK esta corriendo el telefono: una
   TWA se presenta al servidor como Chrome, no como la app. */
def appVersionCode = 4
def appVersionName = "4.77.0"

android {
    namespace 'com.cmtelecom.nexuspro'
    compileSdk 35

    defaultConfig {
        applicationId "com.cmtelecom.nexuspro"
        minSdk 24
        targetSdk 35
        /* Subir SIEMPRE versionCode al publicar (Play rechaza repetirlo) y
           reflejar el mismo par en /app-version.json: de ahi lo lee el aviso
           de "hay version nueva" que sale al entrar al sistema. */
        versionCode appVersionCode
        versionName appVersionName
        manifestPlaceholders = [
            appVersionCode: appVersionCode,
            appVersionName: appVersionName
        ]
    }

    signingConfigs {
        release {
            storeFile rootProject.file(keystoreProps.getProperty('storeFile', 'tallerpro.keystore'))
            storePassword keystoreProps.getProperty('storePassword', '')
            keyAlias keystoreProps.getProperty('keyAlias', 'tallerpro')
            keyPassword keystoreProps.getProperty('keyPassword', '')
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    /* Trusted Web Activity: la app nativa que renderiza el sistema a
       pantalla completa con el motor de Chrome (cámara, descargas,
       notificaciones y todo el runtime web funcionan al 100%). */
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0'
}
